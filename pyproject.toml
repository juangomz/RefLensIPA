[project]
name = "final-project-ipa"
version = "0.1.0"
description = "RefLens + RAG educational project (agents, Neo4j graph, Chroma vector store)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bs4>=0.0.2",
  "chromadb>=1.5.0",
  "ebooklib>=0.20",
  "fastapi>=0.129.0",
  "fire>=0.7.1",
  "ipykernel>=7.1.0",
  "langfuse>=2.0.0",
  "neo4j>=6.1.0",
  "openai>=2.15.0",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.2.1",
  "rich>=14.3.2",
  "tenacity>=9.1.2",
  "uvicorn>=0.41.0",
]

[project.scripts]
# opcional: si tienes main() en esos módulos
# rag-ingest = "rag.cli.ingest:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag*", "reflens*"]
